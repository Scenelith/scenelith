<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Scenelith self-hosted architecture</title>
  <desc id="desc">Browser traffic enters a self-hosted gateway and application runtime, which coordinates workers, collaboration, PostgreSQL, Redis, storage, and configured external providers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#121820"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#69e2b7"/><stop offset="1" stop-color="#7aa7ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#596777"/></marker>
    <style>.box{fill:#171e27;stroke:#2b3542;stroke-width:2;rx:18;filter:url(#shadow)}.core{fill:#19231f;stroke:#4cbf98;stroke-width:2.5;rx:22;filter:url(#shadow)}.title{font:700 21px ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#f2f5f7}.copy{font:500 15px ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#96a2af}.small{font:600 13px ui-monospace,SFMono-Regular,monospace;fill:#6ee7bd;letter-spacing:.5px}.line{fill:none;stroke:#596777;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="52" y="62" class="small">YOUR INFRASTRUCTURE</text>
  <rect x="50" y="88" width="210" height="110" class="box"/><text x="78" y="130" class="title">Browser</text><text x="78" y="160" class="copy">Canvas and operator UI</text>
  <rect x="350" y="70" width="500" height="155" class="core"/><text x="382" y="116" class="small">SCENELITH RUNTIME</text><text x="382" y="154" class="title">Gateway + Web/API</text><text x="382" y="186" class="copy">Auth, projects, canvas, uploads, orchestration</text>
  <path d="M260 143H340" class="line"/>
  <rect x="940" y="88" width="210" height="110" class="box"/><text x="968" y="130" class="title">Providers</text><text x="968" y="160" class="copy">Kie · OpenRouter · Tikwm</text><path d="M850 143H930" class="line"/>
  <rect x="50" y="312" width="250" height="130" class="box"/><text x="78" y="355" class="title">Workers</text><text x="78" y="386" class="copy">Generation · Automation</text><text x="78" y="414" class="copy">Storage · FFmpeg</text>
  <rect x="360" y="312" width="220" height="130" class="box"/><text x="388" y="355" class="title">Collaboration</text><text x="388" y="386" class="copy">Realtime documents</text><text x="388" y="414" class="copy">and presence</text>
  <rect x="640" y="312" width="220" height="130" class="box"/><text x="668" y="355" class="title">PostgreSQL</text><text x="668" y="386" class="copy">Accounts · Projects</text><text x="668" y="414" class="copy">Jobs · Audit history</text>
  <rect x="920" y="312" width="230" height="130" class="box"/><text x="948" y="355" class="title">Storage + Redis</text><text x="948" y="386" class="copy">Local or S3 media</text><text x="948" y="414" class="copy">Ephemeral coordination</text>
  <path d="M510 225L230 302" class="line"/><path d="M565 225L485 302" class="line"/><path d="M640 225L730 302" class="line"/><path d="M705 225L1005 302" class="line"/>
  <rect x="50" y="476" width="1100" height="2" fill="url(#accent)" opacity=".85"/>
</svg>
