name: Contributor License Agreement

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  cla:
    name: CLA signature
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Require the author's versioned signature record
        shell: bash
        run: |
          set -euo pipefail
          case "${PR_AUTHOR}" in
            dependabot\[bot\]|renovate\[bot\]) exit 0 ;;
          esac
          case "${PR_AUTHOR_ASSOCIATION}" in
            OWNER|MEMBER|COLLABORATOR) exit 0 ;;
          esac
          [[ "${PR_AUTHOR}" =~ ^[A-Za-z0-9-]+$ ]]
          signature_path=".github/cla-signatures/v1/${PR_AUTHOR}.json"
          changed_files="$(mktemp)"
          signature_json="$(mktemp)"
          trap 'rm -f "${changed_files}" "${signature_json}"' EXIT

          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' > "${changed_files}"
          while IFS= read -r changed_signature; do
            test "${changed_signature}" = "${signature_path}" || {
              echo "A pull request may not change another contributor's CLA signature: ${changed_signature}" >&2
              exit 1
            }
          done < <(grep -E '^\.github/cla-signatures/v1/[^/]+\.json$' "${changed_files}" || true)

          read_signature() {
            local repository="$1"
            local revision="$2"
            gh api "repos/${repository}/contents/${signature_path}?ref=${revision}" --jq '.content' 2>/dev/null \
              | tr -d '\n' | base64 --decode > "${signature_json}"
          }

          if ! read_signature "${GITHUB_REPOSITORY}" "${BASE_SHA}"; then
            grep -Fx "${signature_path}" "${changed_files}" >/dev/null || {
              echo "CLA signature missing. Add ${signature_path} using .github/cla-signature-template.json." >&2
              exit 1
            }
            read_signature "${HEAD_REPOSITORY}" "${HEAD_SHA}" || {
              echo "Could not read ${signature_path} from the pull request head." >&2
              exit 1
            }
          fi

          jq -e --arg login "${PR_AUTHOR}" '
            type == "object" and
            (keys | sort) == (["githubLogin", "legalName", "signature", "signedAt", "statement", "version"] | sort) and
            .version == "1.0" and
            .githubLogin == $login and
            (.legalName | type == "string" and length >= 2 and length <= 160) and
            .signature == .legalName and
            (.signedAt | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and
            .statement == "I have read and agree to the Scenelith Individual Contributor License Agreement v1.0 in CLA.md."
          ' "${signature_json}" >/dev/null || {
            echo "Invalid CLA record. Copy .github/cla-signature-template.json and fill it exactly." >&2
            exit 1
          }
