name: Release container image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: scenelith_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scenelith_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/scenelith_test
      SCENELITH_DEPLOYMENT_TYPE: selfhost
      SCENELITH_USAGE_MODE: bring_your_own
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Require a public repository and one exact release version
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          test "${REPOSITORY_VISIBILITY}" = public
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v${version}"
          grep -Fx "SCENELITH_VERSION=${version}" deploy/selfhost/.env.example
      - name: Re-run the complete source quality gate for this tag
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci
          npm run selfhost:audit
          npm run selfhost:bundle
          npm test
          npm run build
      - name: Preserve the exact validated installation assets
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: selfhost-release-assets
          path: |
            dist/scenelith-selfhost.tar.gz
            dist/scenelith-selfhost.tar.gz.sha256
            dist/install.sh
          if-no-files-found: error
          retention-days: 7

  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: registry
        name: Normalize the OCI registry namespace
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.0.0
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/scenelith
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.1.0
        with:
          context: .
          file: Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application
          provenance: mode=max
          sbom: true
      - name: Prove the release workflow owns the package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: scenelith
        run: |
          package_repository="$(gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}" \
            --jq '.repository.full_name // ""')"
          printf 'Package repository: %s\n' "${package_repository:-unlinked}"
          test "${package_repository,,}" = "${GITHUB_REPOSITORY,,}"
      - name: Reject vulnerable or secret-bearing release images
        run: |
          docker run --rm \
            --volume "${HOME}/.docker:/root/.docker:ro" \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image \
            --image-src remote \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            --timeout 15m \
            "ghcr.io/${{ steps.registry.outputs.owner }}/scenelith@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.1.0
        with:
          subject-name: ghcr.io/${{ steps.registry.outputs.owner }}/scenelith
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  bundle-smoke:
    needs: [validate, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: selfhost-release-assets
          path: dist
      - name: Start the exact source-free bundle users will download
        run: |
          mkdir -p /tmp/scenelith-release-smoke
          tar -xzf dist/scenelith-selfhost.tar.gz -C /tmp/scenelith-release-smoke
          cd /tmp/scenelith-release-smoke/scenelith-selfhost
          ./scenelith init
          ./scenelith start
      - name: Verify the published image exposes only the self-hosted runtime
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 5 --retry-all-errors http://localhost/api/health/ready
          curl --fail --silent http://localhost/api/runtime/settings > /tmp/scenelith-release-runtime.json
          jq -e '.deployment.type == "selfhost"' /tmp/scenelith-release-runtime.json
          jq -e '.capabilities.usageMode == "bring_your_own"' /tmp/scenelith-release-runtime.json
          jq -e '.capabilities.billing == false' /tmp/scenelith-release-runtime.json
      - name: Show bundle logs on failure
        if: failure()
        run: |
          if [ -d /tmp/scenelith-release-smoke/scenelith-selfhost ]; then
            cd /tmp/scenelith-release-smoke/scenelith-selfhost
            docker compose --env-file deploy/selfhost/.env -f deploy/selfhost/compose.yaml logs --no-color --tail 200
          fi
      - name: Stop the release smoke stack
        if: always()
        run: |
          if [ -f /tmp/scenelith-release-smoke/scenelith-selfhost/deploy/selfhost/.env ]; then
            cd /tmp/scenelith-release-smoke/scenelith-selfhost
            ./scenelith stop
          fi

  release:
    needs: bundle-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: selfhost-release-assets
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.1.0
        with:
          subject-path: dist/scenelith-selfhost.tar.gz
      - name: Publish the release only after the image is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/scenelith-selfhost.tar.gz \
              dist/scenelith-selfhost.tar.gz.sha256 \
              dist/install.sh \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/scenelith-selfhost.tar.gz \
              dist/scenelith-selfhost.tar.gz.sha256 \
              dist/install.sh \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes
          fi
